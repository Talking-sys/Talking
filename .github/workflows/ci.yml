name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Tests
        env:
          APP_TRANSLATE_PROVIDERS: stub
          APP_TTS_PROVIDERS: ""
          APP_ENV: test
        run: pytest -q
      - name: pip-audit (non-blocking on first skeleton)
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - name: bandit (non-blocking on first skeleton)
        continue-on-error: true
        run: bandit -q -r talking -x talking/static || true

  deploy:
    # Stubbed until hosting secrets exist (EKS/Cloudflare). Do not enable.
    if: false
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on push to main
        run: echo "Deploy step is disabled until secrets exist. See docs/ROADMAP.md M12."
